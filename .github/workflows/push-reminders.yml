name: Push Reminders

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-push-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push reminders
        env:
          NOTIFICATIONS_RUN_URL: ${{ secrets.NOTIFICATIONS_RUN_URL }}
          NOTIFICATIONS_CRON_TOKEN: ${{ secrets.NOTIFICATIONS_CRON_TOKEN }}
        run: |
          if [ -z "$NOTIFICATIONS_RUN_URL" ] || [ -z "$NOTIFICATIONS_CRON_TOKEN" ]; then
            echo "Missing NOTIFICATIONS_RUN_URL or NOTIFICATIONS_CRON_TOKEN secret"
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST \
            -H "x-notifications-cron-token: $NOTIFICATIONS_CRON_TOKEN" \
            "$NOTIFICATIONS_RUN_URL"
