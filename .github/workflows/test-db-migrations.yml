name: Test DB migrations

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify PostgreSQL 16 binaries and cluster prerequisites
        run: |
          if [[ $(id -u) == 0 || ! -w /tmp || ! -x /tmp ]]; then
            echo "The suite requires a non-root user with a writable /tmp." >&2
            exit 1
          fi
          for tool in initdb pg_ctl postgres; do
            binary="$TEST_PG_BIN/$tool"
            if [[ ! -x "$binary" ]]; then
              echo "Missing or non-executable binary at $binary" >&2
              exit 1
            fi
            version=$("$binary" --version)
            echo "$binary: $version"
            [[ "$version" == "$tool (PostgreSQL) 16."* ]] || exit 1
          done

      - run: npm ci
      - run: npm run test:db:migrations
